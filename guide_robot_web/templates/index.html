<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guide Robot Display</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="app-wrapper">
        <main id="display-area">
            <div class="display-header">
                <div class="display-header-left">
                    <div class="robot-indicator">
                        <span class="pulse-ring"></span>
                        <span class="pulse-dot"></span>
                    </div>
                    <span class="display-label">Guide Robot</span>
                </div>
            </div>

            <div class="stream-container">
                <div id="stream-output">Guide Robot Online. Awaiting commands...</div>
                <span class="stream-cursor" id="stream-cursor"></span>
            </div>
        </main>

        <div id="route-view" class="hidden">
            <section class="map-panel">
                <div class="map-stage">
                    <img id="floor-map" src="static/NSPU_campus_map_labeled.png" alt="Campus map">
                    <div id="map-route-stats">
                        <div class="distance-row">
                            <img src="static/footstep.png" alt="">
                            <span id="map-distance">-- ft</span>
                        </div>
                        <div id="map-time">--</div>
                    </div>
                    <svg id="route-layer" viewBox="0 0 1361 863" preserveAspectRatio="xMidYMid meet">
                        <polyline id="route-line" points=""></polyline>
                        <g id="route-markers"></g>
                    </svg>
                </div>
            </section>

            <aside class="direction-panel">
                <h3>ROUTE</h3>
                <div id="route-start">Start</div>
                <div id="destination-name">Destination</div>
                <div id="route-distance">-- steps</div>
                <div id="route-narration"></div>

                <div id="qr-section" class="qr-section hidden">
                    <div class="qr-divider"></div>
                    <p class="qr-label">Scan for directions</p>
                    <div id="qrcode-container" class="qrcode-container"></div>
                </div>
            </aside>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bwip-js@4/dist/bwip-js-min.js"></script>
    <script src="static/script.js"></script>
</body>
</html>
