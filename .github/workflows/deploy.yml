name: Deploy guide_robot_web to Pages

on:
  push:
    branches:
      - demo # Triggers the deployment on every push to the demo branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Crucial step: Tells GitHub to only host the subfolder contents
          path: './guide_robot_web/templates'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
